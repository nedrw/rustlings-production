[workspace]
resolver = "3"
members = ["kiln", "xtask"]
# Every track is its own cargo workspace under `app/` (plan §3 D6), excluded here so the course's
# `cargo xtask ci` never tries to build a learner's exercise as part of the course itself.
exclude = ["app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
thiserror = "2.0.21"
toml = "0.9.8"

kiln = { path = "kiln" }

# `kiln` must pass the lint ladder it enforces (plan §6, §10): the production lints are denied
# workspace-wide, and each crate relaxes them for `cfg(test)` only.
[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
