# The course's term table.
#
# A translation is not free prose: the same word must mean the same thing in every step of every
# track, or a learner reading a Chinese brief and an English spec sees two vocabularies. This file
# is that agreement, in the only form a machine can check: an English term and, per locale, the
# word the translation uses for it.
#
# **When a translation needs a word this file does not have, add it here first** (authoring.md §8
# rule 5), then translate. A term belongs here when it is (a) part of the course's own vocabulary —
# the names of mechanisms, artifacts and judgments — rather than ordinary English, and (b) likely to
# appear in more than one step. "Raft" and "idempotency key" are terms; "server" is not.
#
# `kiln i18n status` checks the table against the translations: where an English body uses a term
# and the translated body does not use the word agreed here, it says so (as a drift warning — the
# translator acts on it, CI does not fail on it). The `note` is for the translator and is not
# checked.

format_version = 1

# --- The course's own artifacts and mechanisms -----------------------------------------------

[terms."spec"]
zh-Hans = "规格"
note = "a step's read-only test file; `spec/` holds the course's copies"

[terms."scaffold"]
zh-Hans = "脚手架"
note = "the starting state a step lays down for the learner"

[terms."reference solution"]
zh-Hans = "参考解"
note = "the course's own implementation of a step, applied by `kiln solution`"

[terms."gate"]
zh-Hans = "闸门"
note = "one check a step must pass; `must` gates decide the step"

[terms."capability"]
zh-Hans = "能力"
note = "one thing the course teaches, at a depth; the ledger's unit"

[terms."track"]
zh-Hans = "track"
note = "one of the five projects; the word is left in English because it names the course's own structure"

[terms."step"]
zh-Hans = "步"
note = "「这一步」「第 N 步」都算；作为名词时也可以写「步骤」"

[terms."probe"]
zh-Hans = "探题"
zh-Hans-also = ["探针"]
except = ["liveness probe", "readiness probe"]
note = "a small exercise that re-checks one capability; `course/probes/`. The Kubernetes sense of the word is a different term — see `liveness probe`"

[terms."drill"]
zh-Hans = "演练"
note = "a scenario the course runs on purpose, with assertions about the outcome"

[terms."budget"]
zh-Hans = "预算"
note = "a counted allowance, never a duration"

[terms."ledger"]
zh-Hans = "台账"

[terms."fixture"]
zh-Hans = "夹具"
note = "the support code a test drives the project through"

[terms."harness"]
zh-Hans = "装置"
note = "a fixture that runs a scenario rather than a function"

