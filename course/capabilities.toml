# Capability ledger — the single source of truth for what each step teaches (plan §3 D4).
#
# One table per capability. The keys are the four depths of `docs/curriculum.md` §2.1, and a
# value is the step that establishes that depth: "<track>/<phase>.<index>". A missing depth
# means the course does not teach it at that depth; leaving it out is honest, not an omission.
#
# Transcribed from `docs/curriculum.md` §3: 126 capabilities, 165 (capability, depth) slots,
# covering all 148 authored steps. `kiln lint-caps` cross-checks this file against the authored
# `tracks/*/track.toml` files (rule R0) and enforces R1-R6 on top of it.
#
# One slot = the step where that depth is *first established*. A step that re-establishes a
# depth on purpose (plan §3 D4 rule 2) says so with `reteach = "why"` in its own metadata;
# `kiln lint-caps` reports every such declaration instead of recording a second slot here.

