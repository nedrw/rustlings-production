# T2 `relay` — webhook delivery service (24 steps), see `docs/curriculum.md` §7.
#
# Same conventions as `course/tracks/mailer/track.toml` (they are enforced by `kiln lint-caps`):
# `teaches` matches the capability ledger slot by slot, `requires` lists what this step provably
# builds on, `entry`/`spec`/`scaffold`/`solution` are relative to this track directory, `run.cmd`
# runs in `project` below and never through a shell, and the gate ladder only ever tightens.
#
# The ladder starts at `clippy@2` (curriculum.md §7: the transfer step arrives with stricter lints
# and no hints) and keeps every rung T1 established: `spec-integrity`, `caps`, `i18n`, `fmt`,
# `no-todo`, `docs:public`, `exit-code`. `images` is step-scoped (the Postgres steps), `links` sits
# on the steps that ship a page, and `?deny` is a *should* gate until T3 — `cargo-deny` is not
# installed on every machine, and a gate that cannot run must never turn a good step red
# (plan.md §6, authoring.md §7.2).
#
# The first step of the track is a `transfer` step: the learner has done every one of these things
# in `mailer`, so the body is a RECALL/DELTA, the scaffold is the project skeleton, and the spec
# judges the rebuilt service rather than a new idea.

format_version = 1
id = "relay"
index = 2
title = "Relay — webhook delivery service"

# The learner's workspace for this track. Each track is its own cargo workspace (plan §3 D6).
project = "app/relay"

# Exit capabilities (curriculum.md §5): what this track has to have established by its last step.
exit = [
    "delivery/at-least-once@design",
    "delivery/dlq@apply",
    "http/rate-limit@apply",
    "ops/degradation-modes@apply",
    "sec/hmac-signing@apply",
    "sec/ssrf-defense@apply",
]

# ---------------------------------------------------------------------------------------
# Phase A — the service and its boundaries (2.1-2.6): a multi-tenant ingest path that keeps
# what it accepted, at least once.
# ---------------------------------------------------------------------------------------

[[step]]
id = "2.1-project-skeleton"
title = "Rebuild the service shape: typed config, logs, migrations, middleware"
kind = "milestone"
origin = "transfer"
entry = "docs/steps/en/relay/2.1-project-skeleton.md"
time_hint = "120m"
concepts = ["layered middleware", "multi-tenant schema", "startup order"]
teaches = ["http/middleware-layering@apply"]
requires = [
    "repo/workspace-layout@apply",
    "cfg/layered-config@apply",
    "obs/structured-logs@apply",
    "db/migrations@apply",
]
run = { cmd = "cargo test -p relay --test spec_skeleton" }
spec = ["spec/2.1/skeleton.rs"]
scaffold = "skeleton"
solution = "solutions/2.1-project-skeleton.patch"
gates = [
    "spec-integrity",
    "caps",
    "i18n",
    "fmt",
    "clippy@2",
    "no-todo",
    "docs:public",
    "exit-code",
    "images",
]
images = ["postgres:17-alpine"]
hint = "Middleware order is the interface: correlation id outermost, then request logging, then auth (so a rejected request is still logged with its id), then the handler."

