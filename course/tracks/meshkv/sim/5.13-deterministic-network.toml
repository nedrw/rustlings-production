# The schedules `meshkv/5.13-deterministic-network` is judged by.
#
# Course content, at the same trust level as `spec/`: the `sim` gate reads *this* copy. The command
# is the project's own harness (`tests/sim_playbook.rs`, which this step's scaffold ships).
#
# `seeds` is three schedules: `slow:sim@3` asks for at least three, and the gate demands that at
# least two produce different transcripts. What the seed decides here is which node the client's
# writes go to and in which order the faults are felt — so a different seed is a different run of the
# same scenario. What does not depend on the seed is the rule: a write that cannot reach the node it
# was sent to is refused, and a healed link commits.
#
# `replay = 1` is the seed run twice; the transcripts have to be byte-identical.
command = "cargo test -p meshkv --test sim_playbook -- --nocapture"
seeds = [1, 7, 20260101]
replay = 1
