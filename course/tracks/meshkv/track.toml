# T5 `meshkv` — distributed KV on a consensus log (22 steps, optional), see `docs/curriculum.md` §10.
#
# Same conventions as the other four tracks (`kiln lint-caps` enforces them). Two things are
# different here, both decisions rather than accidents (docs/m4-plan.md):
#
# * `requires_track = "jobq"` — the one cross-track `path` dependency the course allows (plan §3
#   D6): 5.20's acceptance is *jobq's engine crate reused with zero lines changed*, so this track
#   builds on the learner's own T3 project. The dependency itself is held back until 5.20's
#   scaffold declares it; the runner refuses to judge any step while `app/jobq` is missing.
# * the ladder starts where T4 ended (clippy@4 and the persistent set), `unsafe-budget@0` runs the
#   whole track, and 5.19 will raise the budget to the number its reference solution actually
#   needs when that step is authored — the one deliberate loosening, argued on the step's page.

format_version = 1
id = "meshkv"
index = 5
title = "Meshkv — distributed KV / scheduler"

requires_track = "jobq"

# The learner's workspace for this track.
project = "app/meshkv"

# Exit capabilities (curriculum.md §10): whatever else happens, these are established here.
exit = [
    "dist/consensus@apply",
    "test/deterministic-simulation@design",
    "dist/partition-drill@operate",
    "ops/cluster-drill@operate",
    "api/library-reuse@design",
    "dist/consistency-audit@operate",
]

