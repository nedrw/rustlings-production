# The one `design` step of this track: the deliverable is a runbook, and the drill script is what
# proves the runbook works (evidence for `design` per curriculum.md §2.1).
[[step]]
id = "1.22-runbook"
title = "Runbook and the first failure drill"
kind = "design"
origin = "teach"
entry = "docs/steps/en/mailer/1.22-runbook.md"
time_hint = "120m"
concepts = ["runbook", "failure drill", "no lost mail"]
teaches = ["ops/runbook-drill@apply"]
# requires: the drill runs the container (1.21) and asserts against the metrics baseline (1.20)
requires = ["obs/metrics-slo@aware", "release/container-image@apply"]
run = { cmd = "cargo test -p mailer --test spec_runbook_drill" }
spec = ["spec/1.22/runbook_drill.rs"]
scaffold = "scaffold/1.22-runbook.patch"
solution = "solutions/1.22-runbook.patch"
gates = [
    "spec-integrity",
    "caps",
    "i18n",
    "fmt",
    "clippy@1",
    "exit-code",
    "no-todo",
    "docs:public",
    "links",
]
hint = "Write the runbook as the drill you will replay: a script asserts recovery (no lost mail, exit code honest), and the page says what a human does when the script fails."
