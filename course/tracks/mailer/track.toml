# T1 `mailer` — subscription microservice (22 steps), see `docs/curriculum.md` §6.
#
# Conventions (all enforced by `kiln lint-caps` unless noted):
#
# * `id` is local to the track: `<phase>.<index>-<slug>`; the CLI and the docs use the
#   fully qualified `<track>/<id>` (authoring.md §1).
# * `teaches` must match the capability ledger (`course/capabilities.toml`) exactly, slot by
#   slot — the ledger is the source of truth, this file points at its positions.
# * `requires` is not tabulated in the curriculum: it lists the slots a step provably builds on,
#   derived from the step text and kept minimal (each one is taught earlier in this track).
# * `entry`, `spec`, `scaffold`, `solution` are relative to this track directory; `entry`
#   additionally carries the `docs/steps/<locale>/` segment the i18n layer rewrites.
# * `run.cmd` is executed in the learner project (`project` below), never through a shell.
# * `gates` use the DSL of authoring.md §7 and only ever tighten along the track: the ladder
#   from plan §6 starts at step 1 and each later step keeps every earlier rung.

format_version = 1
id = "mailer"
index = 1
title = "Mailer — subscription microservice"

# The learner's workspace for this track. Each track is its own cargo workspace (plan §3 D6).
project = "app/mailer"

# Exit capabilities (curriculum.md §5): whatever else happens, these are established here.
exit = [
    "db/migrations@apply",
    "async/graceful-shutdown@apply",
    "err/typed-errors@apply",
    "http/service-skeleton@apply",
    "obs/metrics-slo@aware",
    "release/container-image@apply",
]

# ---------------------------------------------------------------------------------------
# Phase A — skeleton and toolchain (1.1-1.6): a service that starts, logs, and fails well.
# ---------------------------------------------------------------------------------------

[[step]]
id = "1.1-workspace"
title = "Split the crate into a library and a thin binary"
kind = "milestone"
origin = "teach"
entry = "docs/steps/en/mailer/1.1-workspace.md"
time_hint = "60m"
concepts = ["lib/bin split", "workspace layout", "thin main"]
teaches = ["repo/workspace-layout@apply"]
requires = []
run = { cmd = "cargo test -p mailer --test spec_layout" }
spec = ["spec/1.1/layout.rs"]
# A track's first step starts from the track skeleton; every later scaffold is a patch applied on
# top of it (authoring.md §5).
scaffold = "skeleton"
solution = "solutions/1.1-workspace.patch"
gates = ["spec-integrity", "caps", "i18n"]
hint = "`cargo check --lib` decides whether the layout is right, so keep every decision out of `main.rs` and let the library own everything the specs touch."

[[step]]
id = "1.2-toolchain"
title = "Pin the toolchain, formatting and lint policy"
kind = "milestone"
origin = "teach"
entry = "docs/steps/en/mailer/1.2-toolchain.md"
time_hint = "45m"
concepts = ["toolchain pinning", "workspace lints", "MSRV policy"]
teaches = ["repo/toolchain-pinning@apply"]
requires = []
run = { cmd = "cargo test -p mailer --test spec_style" }
spec = ["spec/1.2/style.rs"]
# No scaffold: everything this step adds (the toolchain pin, the style settings, the lint policy) is
# a decision the learner has to make, so the course writes none of it for them.
solution = "solutions/1.2-toolchain.patch"
gates = ["spec-integrity", "caps", "i18n", "fmt", "clippy@1"]
hint = "`rust-toolchain.toml` is the only place the compiler version lives; style belongs in `rustfmt.toml` and `[workspace.lints]`, not in review comments."

[[step]]
id = "1.3-ci"
title = "One command for every check, wired into CI"
kind = "milestone"
origin = "teach"
entry = "docs/steps/en/mailer/1.3-ci.md"
time_hint = "60m"
concepts = ["task runner", "CI parity", "fail fast"]
teaches = ["ci/pipeline@apply"]
# requires: the task runs fmt/clippy over the workspace members created in 1.1
requires = ["repo/workspace-layout@apply"]
run = { cmd = "cargo test -p mailer --test spec_ci" }
spec = ["spec/1.3/ci.rs"]
scaffold = "scaffold/1.3-ci.patch"
solution = "solutions/1.3-ci.patch"
gates = ["spec-integrity", "caps", "i18n", "fmt", "clippy@1"]
hint = "Make CI call the same entry point you run locally (`cargo xtask ci`); YAML that re-implements the checks is how local-green/CI-red starts."

[[step]]
id = "1.4-config"
title = "Typed configuration with a documented override order"
kind = "milestone"
origin = "teach"
entry = "docs/steps/en/mailer/1.4-config.md"
time_hint = "90m"
concepts = ["layered configuration", "override order", "secrets out of the repository"]
teaches = ["cfg/layered-config@apply", "sec/secrets-management@apply"]
# requires: startup reads a typed config out of the lib/bin split of 1.1
requires = ["repo/workspace-layout@apply"]
run = { cmd = "cargo test -p mailer --test spec_config" }
spec = ["spec/1.4/config.rs"]
scaffold = "scaffold/1.4-config.patch"
solution = "solutions/1.4-config.patch"
gates = ["spec-integrity", "caps", "i18n", "fmt", "clippy@1", "exit-code"]
hint = "Pin the order first (defaults < file < environment < flag) and test all four at once; a bad config must exit non-zero before the listener binds."

[[step]]
id = "1.5-errors"
title = "Errors as part of the API"
kind = "milestone"
origin = "teach"
entry = "docs/steps/en/mailer/1.5-errors.md"
time_hint = "60m"
concepts = ["typed errors", "source chain", "status code mapping"]
teaches = ["err/typed-errors@apply"]
# requires: startup failures are mapped into the typed errors this enum owns (1.4)
requires = ["cfg/layered-config@apply"]
run = { cmd = "cargo test -p mailer --test spec_errors" }
spec = ["spec/1.5/errors.rs"]
scaffold = "scaffold/1.5-errors.patch"
solution = "solutions/1.5-errors.patch"
gates = [
    "spec-integrity",
    "caps",
    "i18n",
    "fmt",
    "clippy@1",
    "exit-code",
    "no-todo",
    "docs:public",
]
hint = "Model the failures the caller has to react to; `anyhow` is for the boundary that logs and exits, not for the library that returns."

[[step]]
id = "1.6-logging"
title = "Structured logs with a correlation id per run"
kind = "milestone"
origin = "teach"
entry = "docs/steps/en/mailer/1.6-logging.md"
time_hint = "60m"
concepts = ["structured logging", "JSON and pretty modes", "request id propagation"]
teaches = ["obs/structured-logs@apply", "obs/tracing-propagation@aware"]
# requires: the JSON/pretty mode and log level are config decisions (1.4)
requires = ["cfg/layered-config@apply"]
run = { cmd = "cargo test -p mailer --test spec_logging" }
spec = ["spec/1.6/logging.rs"]
scaffold = "scaffold/1.6-logging.patch"
solution = "solutions/1.6-logging.patch"
gates = [
    "spec-integrity",
    "caps",
    "i18n",
    "fmt",
    "clippy@1",
    "exit-code",
    "no-todo",
    "docs:public",
]
hint = "Log fields, not sentences: assert against a captured JSON writer so a renamed field breaks the test instead of a dashboard."

