    "caps",
    "i18n",
    "fmt",
    "clippy@1",
    "exit-code",
    "no-todo",
    "docs:public",
]
hint = "Stop accepting first, then drain in-flight work, then force-exit on the deadline; the queue is bounded and the overflow policy is a decision you have to make."

