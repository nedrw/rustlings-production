# The `jobq` engine, as it comes out of the box: the library, the two binaries around it, a test
# harness that already works, and the dependencies the first steps need.
#
# T3 step 1 (`jobq/3.1-engine-boundary`) fills the modules in. Later scaffolds add dependencies,
# members and lints *inside the marked blocks* — that rule is what keeps your own edits safe
# (docs/authoring.md §5).

[package]
name = "jobq"
version = "0.1.0"
edition = "2024"

[dependencies]
# kiln:scaffold:begin
chrono = { version = "0.4.42", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "fmt", "env-filter"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }
# kiln:scaffold:end

# The crate's own lint policy. `jobq/3.24-unsafe-budget` is the step that argues for
# `unsafe_code = "deny"`, and the block below is where it lands.
[lints.rust]
# kiln:scaffold:begin
# kiln:scaffold:end

# This project is its own workspace, so it never picks up the course's settings (docs/plan.md §3 D6).
[workspace]
members = [
    # kiln:scaffold:begin
    # kiln:scaffold:end
]
