    "spec-integrity",
    "caps",
    "i18n",
    "fmt",
    "clippy@2",
    "no-todo",
    "docs:public",
    "exit-code",
    "semver@baseline",
]
hint = "The baseline witness is the specification: a function pointer per public function, an exhaustive `match` per public enum, `..` per `#[non_exhaustive]` struct. Rename a parameter type and the crate stops compiling against its own contract."

