# T3 `jobq` — a reusable job queue engine (26 steps), see `docs/curriculum.md` §8.
#
# Same conventions as `course/tracks/{mailer,relay}/track.toml` (`kiln lint-caps` enforces them):
# `teaches` matches the capability ledger slot by slot (R0), `requires` is what this step provably
# builds on (R3), `entry`/`spec`/`scaffold`/`solution` are relative to this track directory,
# `run.cmd` runs in `project` below and never through a shell, and the gate ladder only ever tightens.
#
# The ladder starts at `clippy@2` (where T2 ended), reaches `clippy@3` at 3.3 (`missing_errors_doc`
# and the pedantic whitelist; `disallowed_methods` only starts firing once 3.8 writes `clippy.toml`)
# and `clippy@4` at 3.20 (no new lints: the slow quality gates are must rather than should).
# Every step keeps the ladder T1 and T2 established — `spec-integrity`, `caps`, `i18n`, `fmt`,
# `no-todo`, `docs:public`, `exit-code` — and the step-scoped gates are declared only where the
# artifact they judge exists: `images` on the steps whose spec starts the service against Postgres,
# `links` on the steps that ship a page, `slow:conformance@N` where the store port is the subject.
#
# The slow gates are `kiln`'s own implementations (docs/handoff-m2.md §1): `semver@baseline` compiles
# a course-owned witness of the public surface against the learner's crate, `mutants` mutates the
# modules this step's reference solution touches, `bench-budget` compares counters against a course
# baseline, `unsafe-budget` counts documented `unsafe`, `conformance` re-runs this step's spec once
# per backend in `conformance.toml`. None of them needs a cargo tool this machine may not have;
# `?coverage` is the one that does, and it is a *should* gate for exactly that reason.
#
# `origin`: 3.1 is a `transfer` (the third project skeleton in a row), fourteen steps are `deepen`
# (T1/T2 established the capability at a shallower depth), eleven are `teach`.

format_version = 1
id = "jobq"
index = 3
title = "Jobq — a job queue engine (library, worker, CLI)"

# The learner's workspace for this track. Each track is its own cargo workspace (plan §3 D6).
project = "app/jobq"

# Exit capabilities (curriculum.md §5): what this track has to have established by its last step.
exit = [
    "api/library-design@apply",
    "db/port-conformance@apply",
    "db/atomic-claim@design",
    "async/graceful-shutdown@operate",
    "delivery/dlq@operate",
    "test/mutation@apply",
    "perf/bench-budget@apply",
    "unsafe/budget@apply",
    "ops/runbook-drill@design",
]

# --------------------------------------------------------------------------------------------
# Phase A — the engine and its contract (3.1-3.4): a library someone else can depend on.
# --------------------------------------------------------------------------------------------

[[step]]
id = "3.1-engine-boundary"
title = "Draw the engine boundary: a library the service depends on, never the other way"
kind = "milestone"
origin = "transfer"
entry = "docs/steps/en/jobq/3.1-engine-boundary.md"
time_hint = "120m"
concepts = ["engine vs service", "dependency direction", "public surface"]
teaches = ["api/library-design@aware"]
requires = [
    "repo/workspace-layout@apply",
    "cfg/layered-config@apply",
    "obs/structured-logs@apply",
    "db/migrations@apply",
    "http/service-skeleton@apply",
    "http/middleware-layering@apply",
]
run = { cmd = "cargo test -p jobq --test spec_engine_boundary" }
spec = ["spec/3.1/engine_boundary.rs"]
scaffold = "skeleton"
solution = "solutions/3.1-engine-boundary.patch"
gates = [
    "spec-integrity",
    "caps",
    "i18n",
    "fmt",
    "clippy@2",
    "no-todo",
    "docs:public",
    "exit-code",
]
hint = "Two things are being judged: the engine runs an in-memory queue with no server in the process, and nothing under `src/engine/` reaches into `src/service/` or `src/cli/`."

