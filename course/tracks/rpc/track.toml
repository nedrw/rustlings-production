# T8 `rpc` — a contract-first RPC layer (5 steps, first landing), see `docs/curriculum.md` §13.
#
# Conventions: see the header of `mailer/track.toml`; they are the same for every track.
#
# There is no network here: the contract is data, the deadline is a number, the stream is a window —
# and the judgments are the ones a gRPC service makes on every call.

format_version = 1
id = "rpc"
index = 8
title = "Rpc — a contract-first RPC layer"

# The learner's workspace for this track. Each track is its own cargo workspace (plan §3 D6).
project = "app/rpc"

# Exit capabilities (curriculum.md §5): whatever else happens, these are established here.
exit = [
    "rpc/field-numbers@apply",
    "rpc/deadline@apply",
]

# The track name in other languages; the source title above stays the fallback.
[localized_titles]
zh-Hans = "Rpc —— 契约先行的 RPC 层"

[[step]]
id = "8.1-field-numbers"
title = "The wire is numbers, not names"
kind = "milestone"
origin = "teach"
entry = "docs/steps/en/rpc/8.1-field-numbers.md"
time_hint = "60m"
concepts = ["field number", "wire compatibility", "reserved"]
teaches = ["rpc/field-numbers@apply"]
requires = []
run = { cmd = "cargo test -p rpc --test spec_field_numbers" }
spec = ["spec/8.1/field_numbers.rs"]
scaffold = "skeleton"
solution = "solutions/8.1-field-numbers.patch"
gates = [
    "spec-integrity",
    "caps",
    "i18n",
    "fmt",
    "clippy@1",
]

[[step]]
id = "8.2-deadline"
title = "A deadline is absolute, and every hop pays from it"
kind = "milestone"
origin = "teach"
entry = "docs/steps/en/rpc/8.2-deadline.md"
time_hint = "60m"
concepts = ["absolute deadline", "propagation", "fail before running"]
teaches = ["rpc/deadline@apply"]
requires = ["rpc/field-numbers@apply"]
run = { cmd = "cargo test -p rpc --test spec_deadline" }
spec = ["spec/8.2/deadline.rs"]
scaffold = "scaffold/8.2-deadline.patch"
solution = "solutions/8.2-deadline.patch"
gates = [
    "spec-integrity",
    "caps",
    "i18n",
    "fmt",
    "clippy@1",
    "no-todo",
    "docs:public",
    "exit-code",
]

[[step]]
id = "8.3-status-codes"
title = "A status code is part of the API"
kind = "milestone"
origin = "teach"
entry = "docs/steps/en/rpc/8.3-status-codes.md"
time_hint = "45m"
concepts = ["canonical status", "retryable", "caller mistake"]
teaches = ["rpc/status-codes@apply"]
requires = ["rpc/deadline@apply"]
run = { cmd = "cargo test -p rpc --test spec_status" }
spec = ["spec/8.3/status.rs"]
scaffold = "scaffold/8.3-status-codes.patch"
solution = "solutions/8.3-status-codes.patch"
gates = [
    "spec-integrity",
    "caps",
    "i18n",
    "fmt",
    "clippy@1",
    "no-todo",
    "docs:public",
    "exit-code",
    "unsafe-budget@0",
]

[[step]]
id = "8.4-server-streaming"
title = "A stream has a window, not a buffer"
kind = "milestone"
origin = "teach"
entry = "docs/steps/en/rpc/8.4-server-streaming.md"
time_hint = "60m"
concepts = ["server streaming", "flow-control window", "backpressure"]
teaches = ["rpc/server-streaming@apply"]
requires = ["rpc/status-codes@apply"]
run = { cmd = "cargo test -p rpc --test spec_stream" }
spec = ["spec/8.4/stream.rs"]
scaffold = "scaffold/8.4-server-streaming.patch"
solution = "solutions/8.4-server-streaming.patch"
gates = [
    "spec-integrity",
    "caps",
    "i18n",
    "fmt",
    "clippy@1",
    "no-todo",
    "docs:public",
    "exit-code",
    "unsafe-budget@0",
]

[[step]]
id = "8.5-multiplexing"
title = "One connection, many streams, no head-of-line blocking"
kind = "milestone"
origin = "teach"
entry = "docs/steps/en/rpc/8.5-multiplexing.md"
time_hint = "60m"
concepts = ["multiplexing", "per-stream window", "head-of-line blocking"]
teaches = ["rpc/multiplexing@design"]
requires = ["rpc/server-streaming@apply"]
run = { cmd = "cargo test -p rpc --test spec_multiplex" }
spec = ["spec/8.5/multiplex.rs"]
scaffold = "scaffold/8.5-multiplexing.patch"
solution = "solutions/8.5-multiplexing.patch"
gates = [
    "spec-integrity",
    "caps",
    "i18n",
    "fmt",
    "clippy@1",
    "no-todo",
    "docs:public",
    "exit-code",
    "unsafe-budget@0",
]
