# The `lakelet` telemetry store, as it comes out of the box: the daemon, the load driver, and the
# fixtures a step's spec drives them through.
#
# `lakelet/4.1-ingest-protocol` fills the modules in. Later scaffolds add dependencies, members and
# lints *inside the marked blocks* — that rule is what keeps your own edits safe (docs/authoring.md
# §5).

[package]
name = "lakelet"
version = "0.1.0"
edition = "2024"

[dependencies]
# kiln:scaffold:begin
# Introduced by `lakelet/4.1-ingest-protocol`: the frame checksum. A production store writes its own
# fast checksum, and this is the crate every Rust project reaches for.
crc32fast = "1.5.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
# kiln:scaffold:end

# The test side: a harness a step ships with (`tests/fuzz_protocol.rs`, `tests/sim_wal.rs`) brings
# its own crates, because a harness is not a dependency of the store. Later scaffolds add them
# inside the marked block, the same rule as above, which is why the block is here before there is
# anything to put in it: a scaffold cannot write outside a region the skeleton declared
# (docs/authoring.md §5.3).
[dev-dependencies]
# kiln:scaffold:begin
# kiln:scaffold:end

# This crate's own lint policy: `lakelet/4.7-columnar-segments` is the step that argues for
# `unsafe_code = "deny"` (bit packing is where the temptation is), and the block below is where it
# lands.
[lints.rust]
# kiln:scaffold:begin
# kiln:scaffold:end

# This project is its own workspace, so it never picks up the course's settings (docs/plan.md §3 D6).
[workspace]
members = [
    # kiln:scaffold:begin
    # kiln:scaffold:end
]
