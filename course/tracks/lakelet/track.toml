    "slow:mutants@80",
]
hint = "One suite, two implementations of the tier port: the local filesystem and an S3-shaped endpoint the spec starts itself (`KILN_BACKEND=local|s3`, so `conformance.toml` says which two). The HTTP half is what relay/2.7 taught, at design depth: a canonical request, a signature, retries that are safe because the object key is the idempotency key, and a listing that pages."

