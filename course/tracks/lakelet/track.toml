# T4 `lakelet` — telemetry ingestion and query (24 steps), see `docs/curriculum.md` §9.
#
# Same conventions as `course/tracks/{mailer,relay,jobq}/track.toml` (`kiln lint-caps` enforces them):
# `teaches` matches the capability ledger slot by slot (R0), `requires` is what this step provably
# builds on (R3), `entry`/`spec`/`scaffold`/`solution` are relative to this track directory,
# `run.cmd` runs in `project` below and never through a shell, and the gate ladder only ever tightens.
#
# The ladder starts where T3 ended — `clippy@4`, and the persistent set (`spec-integrity`, `caps`,
# `i18n`, `fmt`, `no-todo`, `docs:public`, `exit-code`) — and differs from T3 in three places, each
# one a decision rather than an accident (docs/m3-plan.md §6):
#
# * **no `semver@baseline`**: the gate arrives with the capability that teaches it, and T4 has no
#   `api/library-design` slot. T4's public surface is the wire format, and that is pinned the way
#   bytes have to be pinned: `spec/4.1/ingest_protocol.rs` holds the frames, and `spec-integrity`
#   holds their hashes.
# * **`links` is step-scoped**, as plan §6 asks: it is declared by the steps that ship a page
#   (`docs/protocol.md`, the ADR, the format, the query page, the perf/profile/soak/capacity pages,
#   the DR drill, the build and supply-chain pages, the rotation page, the runbook).
# * **the three new slow gates** — `slow:sim@N`, `slow:fuzz@N`, `slow:soak@N` — are kiln's own
#   implementation (plan §6, handoff M3 §4): the seeds, the workload floor and the live-counter
#   bounds live in `sim/`, `fuzz/` and `soak/` files the course owns, and every judgement is a
#   count, a transcript or a bound. `slow:mutants@80` is declared by the twelve steps whose module is
#   where correctness is decided (not by all twenty-four): it costs about a minute per step, and the
#   plan's §6 list keeps slow quality gates step-scoped where the artifact they judge appears.
#
# `origin`: 4.1 is a `transfer` (the fourth project skeleton in a row, as `jobq/3.1` was the third),
# sixteen steps are `teach` (T4 establishes twenty-two slots no earlier track reached), seven are
# `deepen` (4.4, 4.6, 4.15, 4.21, 4.22, 4.23, 4.24).

format_version = 1
id = "lakelet"
index = 4
title = "Lakelet — a telemetry store with a query engine"


# The learner's workspace for this track. Each track is its own cargo workspace (plan §3 D6), and it
# has no database: the point of T4 is the store the project builds itself (WAL, segments, compaction).
project = "app/lakelet"

# Exit capabilities (curriculum.md §5): what this track has to have established by its last step.
exit = [
    "ingest/protocol@apply",
    "io/batching@design",
    "store/wal-recovery@apply",
    "store/columnar@apply",
    "store/compaction@design",
    "query/engine@design",
    "query/index-pruning@apply",
    "perf/profiling@operate",
    "perf/soak@apply",
    "ops/backup-restore@apply",
    "build/reproducibility@apply",
    "ops/runbook-drill@operate",
]

# --------------------------------------------------------------------------------------------
# Phase A — the ingest protocol, its edges, and the write path (4.1-4.4).
# --------------------------------------------------------------------------------------------

# The track name in other languages; the source title above stays the fallback.
[localized_titles]
zh-Hans = "Lakelet —— 遥测存储与查询引擎"

[[step]]
id = "4.1-ingest-protocol"
title = "Framing is the interface: a length-prefixed ingest protocol with a checksum"
kind = "milestone"
origin = "transfer"
entry = "docs/steps/en/lakelet/4.1-ingest-protocol.md"
time_hint = "120m"
concepts = ["length-prefixed framing", "checksum", "partial reads"]
teaches = ["ingest/protocol@apply"]
# requires: the fourth project skeleton, and the pieces it re-stands (the learner has done this in
# mailer/1.1, relay/2.1 and jobq/3.1 — the DELTA is the binary protocol and the append-only store).
requires = [
    "repo/workspace-layout@apply",
    "cfg/layered-config@design",
    "obs/structured-logs@design",
    "time/clock-injection@apply",
    "cli/contract@apply",
]
run = { cmd = "cargo test -p lakelet --test spec_ingest_protocol" }
spec = ["spec/4.1/ingest_protocol.rs"]
scaffold = "skeleton"
solution = "solutions/4.1-ingest-protocol.patch"
gates = [
    "spec-integrity",
    "caps",
    "i18n",
    "fmt",
    "clippy@4",
    "no-todo",
    "docs:public",
    "exit-code",
    "links",
]
hint = "A frame is a length, a version byte, the payload and a checksum, and the decoder has to answer three ways: a whole frame, a short buffer that needs more bytes, and a frame that is not this protocol. `docs/protocol.md` is what the bytes mean to anyone else."

