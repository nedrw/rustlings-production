    "caps",
    "i18n",
    "fmt",
    "clippy@4",
    "no-todo",
    "docs:public",
    "exit-code",
    "links",
    "slow:soak@4000",
]
hint = "A label with an unbounded value set is how a telemetry store dies: the cap is a policy with a counter (`series_rejected_total`), the refusal is visible to the client, and `docs/cardinality.md` prices the series that were kept. The soak gate is here because a cap that leaks is what a long run finds."

