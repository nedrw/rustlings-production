# The overload schedules `lakelet/4.6-ingest-backpressure` is judged by, measured on the reference
# solution.
#
# Course content, at the same trust level as `spec/`: readable, useless to edit, because the `sim`
# gate reads *this* copy. The command is the project's own harness (`tests/sim_backpressure.rs`, which
# this step's scaffold ships); the gate runs it once per seed below with `KILN_SIM_SEED` set, and
# every run has to be green — a scenario that holds under one interleaving and breaks under another
# is exactly the bug this gate is about.
#
# `seeds` is three schedules and the count is the judgement: `slow:sim@3` asks for at least three, and
# the gate also demands that at least two of them produce *different* transcripts, so a harness that
# ignored the seed would fail rather than pass three times. What the schedules decide here is **who
# gets dropped**: three producers race into a queue whose bound is three, the policies that drop
# either refuse the arriving frame or take back the one that has been waiting longest, and the arrival
# order — the seed's — is what decides which frame was in the way. One schedule is one answer to a
# question with several legal ones, which is why this step is judged by three of them and why the
# harness prints the seed nowhere: the digests below differ because the events differ.
#
# `replay = 1` is the seed that is run *twice*: the two transcripts have to be byte-identical. That is
# the property the harness is written for — every line is an event, a count or a frame's own name,
# never a wall clock, a path or an address — and a scenario that fails it is a flaky test wearing a
# simulation's name. Seed `1` is also the default the harness uses when nothing sets `KILN_SIM_SEED`,
# so a learner running the file by hand sees the schedule this gate replays.
command = "cargo test -p lakelet --test sim_backpressure -- --nocapture"
seeds = [1, 7, 20260101]
replay = 1
