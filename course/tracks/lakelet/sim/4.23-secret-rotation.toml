# The rotation schedules `lakelet/4.23-secret-rotation` is judged by, measured on the reference
# solution.
#
# Course content, at the same trust level as `spec/`: readable, useless to edit, because the `sim`
# gate reads *this* copy. The command is the project's own harness (`tests/sim_rotation.rs`, which
# this step's scaffold ships complete); the gate runs it once per seed below with `KILN_SIM_SEED`
# set, and every run has to be green — a rotation that only holds under the seed somebody happened
# to try is exactly the failure this gate is about.
#
# What the seed decides here is the **whole schedule**: how many clients there are (three to six),
# how long each one's token is issued for (thirty seconds, one minute, two minutes), how many
# batches each one sends, after which client the new key arrives — and which client is the *late*
# one, whose token was already expired before the run started. All of it comes out of the store's own
# generator (`src/engine/rng.rs`), so the same seed rotates the same way on every machine.
#
# What the scenario runs is the real thing rather than a model of it: `service::ingest::serve` in
# this process, over real sockets, against a real store and a ring of real files, so the token check,
# the queue and the write path are the deployment's own. The one clock it cannot own is the daemon's
# — `service::ingest` reads the machine's instant once per connection, which is the design — so every
# instant the schedule needs is placed relative to one reading of that clock, and no verdict depends
# on it: keys open a minute before the run, tokens that are meant to be good are minted as issued in
# the past, and the numbers below are counts. The ring's own arithmetic is checked against instants
# the scenario hands in, which is what `verify(token, now)` and `earliest_safe_retirement` take them
# for.
#
# The transcript is what the gate compares, one line per observation and counts only: the plan, one
# line per client (its batches, the key that signed its token, the lifetime, whether it is the late
# one, and how many of its batches the store took), the rotation with the instant the old key may
# leave at *as an offset from the start*, how many clients each key signed, how many were refused
# inside their token's lifetime (the claim, and it is zero in every seed) and how many because the
# token was already expired (the contrast), the keys the ring held at the end and which one is
# preferred, how many batches reached the store, and a digest over their ids, sorted. No line carries
# a wall clock, a path, an address or the seed.
#
# The three seeds differ in the shape of the schedule, and that is measured rather than argued:
#
#   seed 1:        four clients; the new key arrives after the second; the *late* client is the
#                  second one, and the ring signs one client with the old key and two with the new;
#                  eight batches sent, six accepted; digest f6b1e9ae81a37144.
#   seed 7:        five clients; the new key arrives after the third; the late client is the fourth,
#                  and the old key signs three clients and the new one a single client; eleven
#                  batches sent, eight accepted; digest 7735004e3a107f2a.
#   seed 20260101: five clients; the new key arrives after the second; the late client is the third,
#                  and each key signs two clients; eleven batches sent, eight accepted; digest
#                  e88cde7b31d28ce8.
#
# In all three, `refused inside_lifetime=0` and `late=1`: a client whose token is inside its lifetime
# is never refused across the rotation, and the client whose token had expired is — which is the
# contrast the step is about, and the reason the claim is about lifetimes rather than about keys.
# Every seed also has at least one client served *before* the new key arrived and at least one after
# it, so "which key signed this" is answered by two keys in every run.
#
# `replay = 1` is the seed that is run *twice*: the two transcripts have to be byte-identical, which
# is why no line of an agreeing run carries the seed. Three identical transcripts would mean the
# harness never read `KILN_SIM_SEED` — so one seed was run three times — and the gate refuses that; a
# transcript that printed its own seed would satisfy the demand without rotating anything, which is
# the argument `tests/sim_model.rs` makes for the walk it ships, and this harness follows it.
command = "cargo test -p lakelet --test sim_rotation -- --nocapture"
seeds = [1, 7, 20260101]
replay = 1
